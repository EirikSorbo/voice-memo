<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Voice Memo" />
  <title>Voice Memo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.1);
      --border-mid: rgba(0,0,0,0.18);
      --text: #1a1a1a;
      --muted: #888;
      --hint: #bbb;
      --green: #1D9E75;
      --red: #E24B4A;
      --red-bg: #FDF0F0;
      --red-border: rgba(226,75,74,0.3);
      --blue: #378ADD;
      --radius: 10px;
      --tab-h: 60px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --surface: #1c1c1a;
        --border: rgba(255,255,255,0.1);
        --border-mid: rgba(255,255,255,0.18);
        --text: #f0efe8;
        --muted: #888;
        --hint: #555;
        --red-bg: #2a1515;
        --red-border: rgba(226,75,74,0.25);
      }
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Tab shell ── */
    .shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    .tab-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .tab-panel {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      display: none;
    }

    .tab-panel.active { display: flex; flex-direction: column; }

    /* ── Bottom tab bar ── */
    .tab-bar {
      height: var(--tab-h);
      padding-bottom: env(safe-area-inset-bottom, 0);
      background: var(--surface);
      border-top: 0.5px solid var(--border-mid);
      display: flex;
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      color: var(--hint);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.15s;
      border: none;
      background: none;
    }

    .tab-item svg { width: 22px; height: 22px; }
    .tab-item.active { color: var(--red); }

    /* ── Record tab ── */
    .app {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 1rem;
      gap: 0;
    }

    .title {
      font-family: 'Fraunces', serif;
      font-weight: 300;
      font-size: 24px;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 32px;
      text-align: center;
    }

    /* ── Setup / login cards ── */
    .center-card {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 340px;
      text-align: center;
    }

    .center-card.visible { display: flex; }

    .center-card p {
      font-size: 12px;
      line-height: 1.7;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .center-card code {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text);
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
    }

    .recorder-ui { display: none; flex-direction: column; align-items: center; }
    .recorder-ui.visible { display: flex; }

    .record-ring {
      position: relative;
      width: 148px;
      height: 148px;
      margin-bottom: 16px;
    }

    .pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--red);
      opacity: 0;
      transform: scale(1);
    }

    .pulse.active { animation: ripple 1.8s ease-out infinite; }
    .pulse:nth-child(2).active { animation-delay: 0.6s; }
    .pulse:nth-child(3).active { animation-delay: 1.2s; }

    @keyframes ripple {
      0%   { transform: scale(1);   opacity: 0.5; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    .mic-btn {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1.5px solid var(--red-border);
      background: var(--red-bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
    }

    .mic-btn:active { transform: scale(0.95); }
    .mic-btn.recording { background: var(--red); border-color: var(--red); }
    .mic-btn.paused { background: var(--red-bg); border-color: var(--red-border); }

    .mic-icon {
      width: 34px;
      height: 34px;
      color: var(--red);
      transition: color 0.2s;
    }

    .mic-btn.recording .mic-icon { color: white; }
    .mic-btn.paused .mic-icon { color: var(--red); }

    /* ── Language toggle ── */
    .lang-toggle {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 0.5px solid var(--border-mid);
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
      margin-bottom: 20px;
    }

    .lang-btn {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      border: none;
      background: none;
      color: var(--muted);
      border-radius: 16px;
      padding: 5px 14px;
      cursor: pointer;
      transition: all 0.18s;
      -webkit-tap-highlight-color: transparent;
    }

    .lang-btn.active {
      background: var(--red);
      color: white;
    }

    .mini-controls {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      height: 36px;
      margin-bottom: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .mini-controls.visible { opacity: 1; pointer-events: all; }

    .mini-btn {
      background: none;
      border: 0.5px solid var(--border-mid);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
      color: var(--muted);
    }

    .mini-btn:active { transform: scale(0.93); background: var(--border); }
    .mini-btn svg { width: 16px; height: 16px; }

    .status {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--hint);
      margin-bottom: 8px;
      height: 16px;
      text-align: center;
      transition: color 0.3s;
    }

    .status.recording { color: var(--red); }
    .status.paused { color: var(--muted); }

    .timer {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      height: 20px;
      margin-bottom: 28px;
      font-variant-numeric: tabular-nums;
    }

    .btn {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 14px 32px;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { transform: scale(0.97); opacity: 0.85; }
    .btn.busy { opacity: 0.5; pointer-events: none; }
    .btn-blue { background: var(--blue); }

    .btn-outline {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
      background: var(--surface);
      border: 0.5px solid var(--border-mid);
      border-radius: var(--radius);
      padding: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-outline:active { transform: scale(0.97); background: var(--border); }
    .btn-outline svg { width: 15px; height: 15px; }

    .feedback {
      margin-top: 20px;
      font-size: 11px;
      letter-spacing: 0.07em;
      color: var(--hint);
      text-align: center;
      height: 16px;
    }

    .feedback.success {
      font-family: 'Fraunces', serif;
      font-weight: 300;
      font-size: 18px;
      letter-spacing: -0.01em;
      color: var(--text);
      height: auto;
    }

    .feedback.error { color: var(--red); height: auto; }

    .dots span { animation: blink 1.2s infinite; opacity: 0; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40%           { opacity: 1; }
    }

    /* ── History tab ── */
    .history-panel {
      padding: 0;
      background: var(--bg);
    }

    .history-header {
      padding: 20px 20px 12px;
      font-family: 'Fraunces', serif;
      font-weight: 300;
      font-size: 24px;
      letter-spacing: -0.02em;
      color: var(--text);
      text-align: center;
    }

    .history-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--hint);
      font-size: 12px;
      letter-spacing: 0.06em;
      gap: 12px;
      padding-bottom: 60px;
    }

    .history-empty svg { width: 40px; height: 40px; opacity: 0.4; }

    .history-list {
      padding: 0 0 16px;
    }

    .history-item {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: 16px 20px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.12s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item:first-child { border-top: 0.5px solid var(--border); }
    .history-item:active { background: var(--bg); }

    .history-item-date {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .history-item-title {
      font-size: 14px;
      color: var(--text);
      line-height: 1.4;
      font-weight: 500;
    }

    .history-item-preview {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-line {
      padding: 20px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--hint);
    }

    .account-line button {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }

    /* ── Report detail view ── */
    .report-detail {
      display: none;
      position: absolute;
      inset: 0;
      background: var(--bg);
      overflow-y: auto;
      z-index: 10;
      flex-direction: column;
    }

    .report-detail.open { display: flex; }

    .report-detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 16px 12px;
      border-bottom: 0.5px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 1;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--red);
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      padding: 4px 0;
      -webkit-tap-highlight-color: transparent;
    }

    .back-btn svg { width: 18px; height: 18px; }

    .report-detail-date {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-left: auto;
    }

    .report-detail-body {
      padding: 20px;
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
      word-break: break-word;
      flex: 1;
    }

    .report-detail-body h1 { font-family: 'Fraunces', serif; font-weight: 300; font-size: 22px; margin-bottom: 16px; }
    .report-detail-body h2 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; }
    .report-detail-body h3 { font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
    .report-detail-body ul { padding-left: 18px; margin: 6px 0; }
    .report-detail-body li { margin: 4px 0; }
    .report-detail-body p { margin: 4px 0; }

    .transcript-details {
      margin: 8px 20px 20px;
      border-top: 0.5px solid var(--border);
      padding-top: 14px;
    }

    .transcript-details summary {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      list-style: none;
    }

    .transcript-details summary::-webkit-details-marker { display: none; }
    .transcript-details summary::before { content: '+ '; }
    .transcript-details[open] summary::before { content: '\2212 '; }

    .transcript-details p {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      font-style: italic;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .detail-actions {
      display: flex;
      gap: 10px;
      margin: 0 20px 12px;
    }

    .detail-actions .btn-outline { flex: 1; }

    .delete-report-btn {
      margin: 0 20px 24px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--red);
      background: none;
      border: 0.5px solid var(--red-border);
      border-radius: var(--radius);
      padding: 12px;
      cursor: pointer;
      width: calc(100% - 40px);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }

    .delete-report-btn:active { background: var(--red-bg); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="tab-content">

      <!-- ── Record tab ── -->
      <div class="tab-panel active" id="tabRecord">
        <div class="app">
          <p class="title">Voice Memo</p>

          <!-- Shown until firebaseConfig is filled in -->
          <div class="center-card" id="setupCard">
            <p>Appen er ikke koblet til Firebase ennå.<br />
               Lim inn <code>firebaseConfig</code> øverst i skriptet i <code>index.html</code>.<br />
               Se <code>SETUP.md</code> for stegene.</p>
          </div>

          <!-- Shown when configured but signed out -->
          <div class="center-card" id="loginCard">
            <button class="btn-outline" id="loginBtn">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.35 11.1H12v2.9h5.35c-.5 2.5-2.6 3.9-5.35 3.9a6 6 0 1 1 0-12c1.5 0 2.9.55 3.95 1.45l2.15-2.15A9 9 0 1 0 12 21c5.2 0 8.85-3.65 8.85-8.8 0-.4-.05-.75-.1-1.1z"/></svg>
              Logg inn med Google
            </button>
          </div>

          <!-- The recorder itself -->
          <div class="recorder-ui" id="recorderUI">
            <div class="record-ring">
              <div class="pulse" id="p1"></div>
              <div class="pulse" id="p2"></div>
              <div class="pulse" id="p3"></div>
              <button class="mic-btn" id="micBtn" aria-label="Ta opp">
                <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="2" width="6" height="12" rx="3"/>
                  <path d="M5 10a7 7 0 0 0 14 0"/>
                  <line x1="12" y1="19" x2="12" y2="22"/>
                  <line x1="8" y1="22" x2="16" y2="22"/>
                </svg>
              </button>
            </div>

            <!-- Language toggle: which language the report is written in -->
            <div class="lang-toggle" id="langToggle">
              <button class="lang-btn active" id="langNo" aria-label="Norsk">NO</button>
              <button class="lang-btn" id="langEn" aria-label="Engelsk">EN</button>
            </div>

            <div class="mini-controls" id="miniControls">
              <button class="mini-btn" id="pauseBtn" aria-label="Pause">
                <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                  <rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>
                </svg>
                <svg id="playIcon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5,3 19,12 5,21"/>
                </svg>
              </button>
              <button class="mini-btn" id="deleteBtn" aria-label="Forkast opptak">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3,6 5,6 21,6"/>
                  <path d="M19,6l-1,14a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2L5,6"/>
                  <path d="M10,11v6M14,11v6"/>
                  <path d="M9,6V4a1,1,0,0,1,1-1h4a1,1,0,0,1,1,1V6"/>
                </svg>
              </button>
            </div>

            <p class="status" id="status">&nbsp;</p>
            <p class="timer" id="timer">&nbsp;</p>

            <button class="btn btn-blue" id="actionBtn">Lag rapport</button>
            <p class="feedback" id="feedback">&nbsp;</p>
          </div>
        </div>
      </div>

      <!-- ── History tab ── -->
      <div class="tab-panel history-panel" id="tabHistory">
        <p class="history-header">Rapporter</p>
        <div id="historyEmpty" class="history-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M9 12h6M9 16h6M7 4H4a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-3"/>
            <rect x="7" y="2" width="10" height="4" rx="1"/>
          </svg>
          <span id="historyEmptyText">Ingen rapporter ennå</span>
        </div>
        <div id="historyList" class="history-list" style="display:none"></div>
        <div class="account-line" id="accountLine" style="display:none">
          <span id="accountEmail"></span> · <button id="logoutBtn">logg ut</button>
        </div>

        <!-- Report detail (slides in over history) -->
        <div class="report-detail" id="reportDetail">
          <div class="report-detail-header">
            <button class="back-btn" id="backBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15,18 9,12 15,6"/>
              </svg>
              Rapporter
            </button>
            <span class="report-detail-date" id="detailDate"></span>
          </div>
          <div class="report-detail-body" id="detailBody"></div>
          <details class="transcript-details" id="transcriptDetails">
            <summary>Transkript</summary>
            <p id="transcriptText"></p>
          </details>
          <div class="detail-actions">
            <button class="btn-outline" id="copyBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              Kopier
            </button>
            <button class="btn-outline" id="shareBtn" style="display:none">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>
              </svg>
              Del
            </button>
          </div>
          <button class="delete-report-btn" id="deleteReportBtn">Slett rapport</button>
        </div>
      </div>

    </div><!-- /tab-content -->

    <!-- Bottom tab bar -->
    <nav class="tab-bar">
      <button class="tab-item active" id="tabBtnRecord">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
        Ta opp
      </button>
      <button class="tab-item" id="tabBtnHistory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 12h6M9 16h6M7 4H4a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-3"/>
          <rect x="7" y="2" width="10" height="4" rx="1"/>
        </svg>
        Rapporter
      </button>
    </nav>
  </div>

  <script type="module">
    // ═══════════════════════════════════════════════════════
    //  KONFIGURASJON — lim inn din firebaseConfig her.
    //  Firebase-konsollen → Project settings → Your apps → Web
    //  Se SETUP.md for alle stegene.
    // ═══════════════════════════════════════════════════════
    const firebaseConfig = {
      apiKey: "AIzaSyDXKIMBjs7bEe5q9hHaSG_trcYpAh3sW4I",
      authDomain: "voice-memo-60950.firebaseapp.com",
      projectId: "voice-memo-60950",
      storageBucket: "voice-memo-60950.firebasestorage.app",
      messagingSenderId: "836581483613",
      appId: "1:836581483613:web:9bb83e74a0c9e28f5e99b4"
    };

    // Bytt til f.eks. 'gemini-2.5-flash' hvis modellen ikke finnes lenger.
    const GEMINI_MODEL = 'gemini-3.5-flash';

    // Gemini tar maks ~20 MB per forespørsel; base64 legger på en tredjedel.
    const MAX_AUDIO_BYTES = 14 * 1024 * 1024;

    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
    import { getAI, getGenerativeModel, GoogleAIBackend, Schema } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-ai.js';
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
      getRedirectResult, onAuthStateChanged, signOut
    } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
    import {
      getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot,
      query, orderBy, Timestamp, writeBatch
    } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';

    // ── State ──────────────────────────────────────────────
    let isRecording = false;
    let isPaused    = false;
    let isBusy      = false;
    let mediaRecorder = null;
    let chunks      = [];
    let timerInterval = null;
    let seconds     = 0;
    let audioBlob   = null;
    let audioMime   = 'audio/webm';
    let forcedLang  = 'norwegian'; // 'norwegian' | 'english'
    let user        = null;
    let reports     = [];
    let unsubscribe = null;
    let currentReport = null;

    // ── Elements ───────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const setupCard    = $('setupCard');
    const loginCard    = $('loginCard');
    const recorderUI   = $('recorderUI');
    const loginBtn     = $('loginBtn');
    const micBtn       = $('micBtn');
    const statusEl     = $('status');
    const timerEl      = $('timer');
    const actionBtn    = $('actionBtn');
    const feedbackEl   = $('feedback');
    const miniControls = $('miniControls');
    const pauseBtn     = $('pauseBtn');
    const pauseIcon    = $('pauseIcon');
    const playIcon     = $('playIcon');
    const pulses       = ['p1','p2','p3'].map($);
    const langNoBtn    = $('langNo');
    const langEnBtn    = $('langEn');

    const tabBtnRecord  = $('tabBtnRecord');
    const tabBtnHistory = $('tabBtnHistory');
    const tabRecord     = $('tabRecord');
    const tabHistory    = $('tabHistory');
    const historyEmpty  = $('historyEmpty');
    const historyEmptyText = $('historyEmptyText');
    const historyList   = $('historyList');
    const accountLine   = $('accountLine');
    const accountEmail  = $('accountEmail');
    const logoutBtn     = $('logoutBtn');
    const reportDetail  = $('reportDetail');
    const backBtn       = $('backBtn');
    const detailBody    = $('detailBody');
    const detailDate    = $('detailDate');
    const transcriptDetails = $('transcriptDetails');
    const transcriptText    = $('transcriptText');
    const copyBtn       = $('copyBtn');
    const shareBtn      = $('shareBtn');
    const deleteReportBtn = $('deleteReportBtn');

    // ── Firebase init ──────────────────────────────────────
    const configured = !firebaseConfig.apiKey.startsWith('LIM-INN');
    let auth, db, ai;

    if (configured) {
      const fbApp = initializeApp(firebaseConfig);
      auth = getAuth(fbApp);
      db   = getFirestore(fbApp);
      ai   = getAI(fbApp, { backend: new GoogleAIBackend() });

      getRedirectResult(auth).catch(err => {
        console.error('Redirect login:', err);
        setFeedback('innlogging feilet — prøv igjen', 'error');
      });

      onAuthStateChanged(auth, u => {
        user = u;
        updateAuthUI();
        if (unsubscribe) { unsubscribe(); unsubscribe = null; }
        reports = [];
        if (u) {
          watchReports(u.uid);
          importLegacyReports(u.uid);
        }
        renderHistory();
      });
    }

    function updateAuthUI() {
      setupCard.classList.toggle('visible', !configured);
      loginCard.classList.toggle('visible', configured && !user);
      recorderUI.classList.toggle('visible', configured && !!user);
      accountLine.style.display = user ? '' : 'none';
      accountEmail.textContent = user ? (user.email || '') : '';
      historyEmptyText.textContent = user ? 'Ingen rapporter ennå' : 'Logg inn for å se rapportene dine';
    }

    loginBtn.addEventListener('click', async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        // Popup-vinduer er upålitelige i standalone-modus på iOS — fall tilbake til redirect
        if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment' || err.code === 'auth/cancelled-popup-request') {
          signInWithRedirect(auth, provider);
        } else if (err.code !== 'auth/popup-closed-by-user') {
          console.error('Login:', err);
          setFeedback('innlogging feilet — prøv igjen', 'error');
        }
      }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    // ── Firestore: rapporter ───────────────────────────────
    const reportsCol = uid => collection(db, 'users', uid, 'reports');

    function watchReports(uid) {
      unsubscribe = onSnapshot(
        query(reportsCol(uid), orderBy('createdAt', 'desc')),
        snap => {
          reports = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderHistory();
        },
        err => console.error('Firestore:', err)
      );
    }

    async function saveReport(data) {
      const ref = await addDoc(reportsCol(user.uid), data);
      return { id: ref.id, ...data };
    }

    // Engangsimport av rapporter fra den gamle localStorage-versjonen av appen
    async function importLegacyReports(uid) {
      if (localStorage.getItem('voiceMemoImported')) return;
      try {
        const old = JSON.parse(localStorage.getItem('voiceMemoReports') || '[]');
        if (old.length > 0) {
          const batch = writeBatch(db);
          for (const r of old.slice(0, 400)) {
            batch.set(doc(reportsCol(uid)), {
              title: r.title || 'Rapport',
              report: r.report || '',
              transcript: '',
              lang: '',
              durationSec: null,
              createdAt: Timestamp.fromDate(new Date(r.date || Date.now())),
              imported: true
            });
          }
          await batch.commit();
          console.log(`Importerte ${old.length} gamle rapporter til Firestore`);
        }
        localStorage.setItem('voiceMemoImported', '1');
      } catch (err) {
        console.error('Import av gamle rapporter feilet:', err);
      }
    }

    // ── Gemini: lyd inn → strukturert rapport ut ───────────
    function buildPrompt(lang) {
      const no = lang === 'norwegian';
      const langName = no ? 'Norwegian (bokmål)' : 'English';
      const h = no ? ['Hovedpunkter', 'Å gjøre', 'Kort oppsummert']
                   : ['Key points', 'Action items', 'In short'];
      return `You receive a voice memo: unstructured spoken thoughts that may contain long pauses, hesitations, repetitions and half-finished reasoning. That is expected. Your job is to surface what the speaker actually meant, keeping every idea that matters and dropping the filler.

Return JSON with:
- "title": a short, concrete title, max 8 words, in ${langName}, no quotes around it
- "report": the note in markdown, written entirely in ${langName}, with exactly these sections: "## ${h[0]}" (bullet points covering every idea and detail that matters), "## ${h[1]}" (ONLY if concrete tasks or follow-ups were mentioned — otherwise omit this section entirely), and "## ${h[2]}" (a single sentence)
- "transcript": a lightly cleaned-up transcription of what was said, in the language actually spoken (remove filler words and stutters, keep all content and phrasing)`;
    }

    async function generateReport(blob, mime, lang) {
      const model = getGenerativeModel(ai, {
        model: GEMINI_MODEL,
        systemInstruction: buildPrompt(lang),
        generationConfig: {
          responseMimeType: 'application/json',
          responseSchema: Schema.object({
            properties: {
              title: Schema.string(),
              report: Schema.string(),
              transcript: Schema.string()
            }
          })
        }
      });

      const base64 = await blobToBase64(blob);
      const result = await model.generateContent([
        { inlineData: { mimeType: mime, data: base64 } },
        { text: 'Here is the voice memo.' }
      ]);

      const raw = result.response.text();
      try {
        return JSON.parse(raw);
      } catch {
        // Skulle JSON-en ryke: bruk råteksten som rapport i stedet for å miste memoet
        return { title: 'Rapport', report: raw, transcript: '' };
      }
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function friendlyError(err) {
      const msg = String(err && (err.message || err));
      if (/quota|429|resource.?exhausted/i.test(msg)) return 'AI-kvoten er brukt opp for i dag — prøv igjen i morgen';
      if (/not found|404/i.test(msg)) return 'modellen finnes ikke lenger — oppdater GEMINI_MODEL i index.html';
      if (/network|fetch|offline/i.test(msg)) return 'nettverksfeil — sjekk tilkoblingen og prøv igjen';
      return 'noe gikk galt — prøv igjen';
    }

    // ── Helpers ────────────────────────────────────────────
    function pad(n) { return n < 10 ? '0' + n : String(n); }

    function setFeedback(msg, cls) {
      feedbackEl.textContent = msg || ' ';
      feedbackEl.className = 'feedback' + (cls ? ' ' + cls : '');
    }

    function setPauseIcon(paused) {
      pauseIcon.style.display = paused ? 'none' : '';
      playIcon.style.display  = paused ? '' : 'none';
    }

    function setBusy(busy) {
      isBusy = busy;
      if (busy) {
        actionBtn.className = 'btn btn-blue busy';
        actionBtn.innerHTML = 'Analyserer<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
      } else {
        actionBtn.className = 'btn btn-blue';
        actionBtn.textContent = 'Lag rapport';
      }
    }

    function startTimer() {
      timerEl.textContent = pad(Math.floor(seconds / 60)) + ':' + pad(seconds % 60);
      timerInterval = setInterval(() => {
        seconds++;
        timerEl.textContent = pad(Math.floor(seconds / 60)) + ':' + pad(seconds % 60);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function pickMimeType() {
      const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
      for (const c of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
      }
      return ''; // la nettleseren velge (Safari ender på audio/mp4)
    }

    function stopRecording() {
      return new Promise(resolve => {
        if (!mediaRecorder) { resolve(); return; }
        mediaRecorder.onstop = () => {
          audioMime = (mediaRecorder.mimeType || audioMime || 'audio/webm').split(';')[0];
          audioBlob = new Blob(chunks, { type: audioMime });
          try { mediaRecorder.stream.getTracks().forEach(t => t.stop()); } catch {}
          resolve();
        };
        if (isPaused) { try { mediaRecorder.resume(); } catch {} }
        mediaRecorder.stop();
        isRecording = false;
        isPaused = false;
        stopTimer();
        micBtn.classList.remove('recording', 'paused');
        pulses.forEach(p => p.classList.remove('active'));
        statusEl.textContent = 'opptak klart';
        statusEl.className = 'status';
        setPauseIcon(false);
      });
    }

    function resetAll() {
      if (mediaRecorder && (isRecording || isPaused)) {
        mediaRecorder.onstop = () => {};
        try { if (isPaused) mediaRecorder.resume(); mediaRecorder.stop(); } catch {}
        try { mediaRecorder.stream.getTracks().forEach(t => t.stop()); } catch {}
      }
      isRecording = false;
      isPaused = false;
      audioBlob = null;
      chunks = [];
      seconds = 0;
      stopTimer();
      micBtn.classList.remove('recording', 'paused');
      pulses.forEach(p => p.classList.remove('active'));
      miniControls.classList.remove('visible');
      timerEl.innerHTML = '&nbsp;';
      statusEl.innerHTML = '&nbsp;';
      statusEl.className = 'status';
      setPauseIcon(false);
      setBusy(false);
      setFeedback('');
    }

    // ── Language toggle ────────────────────────────────────
    langNoBtn.addEventListener('click', () => {
      forcedLang = 'norwegian';
      langNoBtn.classList.add('active');
      langEnBtn.classList.remove('active');
    });

    langEnBtn.addEventListener('click', () => {
      forcedLang = 'english';
      langEnBtn.classList.add('active');
      langNoBtn.classList.remove('active');
    });

    // ── Tab switching ──────────────────────────────────────
    function showTab(name) {
      const record = name === 'record';
      tabRecord.classList.toggle('active', record);
      tabHistory.classList.toggle('active', !record);
      tabBtnRecord.classList.toggle('active', record);
      tabBtnHistory.classList.toggle('active', !record);
    }

    tabBtnRecord.addEventListener('click', () => showTab('record'));
    tabBtnHistory.addEventListener('click', () => showTab('history'));

    // ── History rendering ──────────────────────────────────
    function formatDate(ts) {
      const d = ts && ts.toDate ? ts.toDate() : new Date();
      return d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'short', year: 'numeric' }) +
             ' · kl. ' + d.toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' });
    }

    function previewOf(md) {
      return md
        .replace(/^#+.*/gm, '')
        .replace(/\*\*/g, '')
        .replace(/\*/g, '')
        .replace(/^- /gm, '')
        .split('\n')
        .map(l => l.trim())
        .filter(Boolean)
        .join(' ')
        .slice(0, 100);
    }

    function renderHistory() {
      if (reports.length === 0) {
        historyEmpty.style.display = '';
        historyList.style.display = 'none';
        return;
      }
      historyEmpty.style.display = 'none';
      historyList.style.display = '';
      historyList.innerHTML = reports.map(r => `
        <div class="history-item" data-id="${r.id}">
          <span class="history-item-date">${formatDate(r.createdAt)}</span>
          <span class="history-item-title">${escHtml(r.title || 'Rapport')}</span>
          <span class="history-item-preview">${escHtml(previewOf(r.report || ''))}</span>
        </div>
      `).join('');

      historyList.querySelectorAll('.history-item').forEach(el => {
        el.addEventListener('click', () => {
          const r = reports.find(x => x.id === el.dataset.id);
          if (r) openReport(r);
        });
      });
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function mdToHtml(md) {
      const lines = md.split('\n');
      const out = [];
      let inList = false;
      for (const line of lines) {
        if (line.startsWith('### ')) {
          if (inList) { out.push('</ul>'); inList = false; }
          out.push(`<h3>${inlineMd(line.slice(4))}</h3>`);
        } else if (line.startsWith('## ')) {
          if (inList) { out.push('</ul>'); inList = false; }
          out.push(`<h2>${inlineMd(line.slice(3))}</h2>`);
        } else if (line.startsWith('# ')) {
          if (inList) { out.push('</ul>'); inList = false; }
          out.push(`<h1>${inlineMd(line.slice(2))}</h1>`);
        } else if (line.startsWith('- ')) {
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push(`<li>${inlineMd(line.slice(2))}</li>`);
        } else if (line.trim() === '') {
          if (inList) { out.push('</ul>'); inList = false; }
        } else {
          if (inList) { out.push('</ul>'); inList = false; }
          out.push(`<p>${inlineMd(line)}</p>`);
        }
      }
      if (inList) out.push('</ul>');
      return out.join('\n');
    }

    function inlineMd(text) {
      return escHtml(text)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
    }

    // ── Report detail ──────────────────────────────────────
    function openReport(r) {
      currentReport = r;
      detailDate.textContent = formatDate(r.createdAt);
      detailBody.innerHTML = `<h1>${escHtml(r.title || 'Rapport')}</h1>` + mdToHtml(r.report || '');
      if (r.transcript) {
        transcriptDetails.style.display = '';
        transcriptDetails.open = false;
        transcriptText.textContent = r.transcript;
      } else {
        transcriptDetails.style.display = 'none';
      }
      shareBtn.style.display = navigator.share ? '' : 'none';
      reportDetail.classList.add('open');
      reportDetail.scrollTop = 0;
    }

    backBtn.addEventListener('click', () => {
      reportDetail.classList.remove('open');
      currentReport = null;
    });

    copyBtn.addEventListener('click', async () => {
      if (!currentReport) return;
      const text = `# ${currentReport.title}\n\n${currentReport.report}`;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.querySelector('svg').style.color = 'var(--green)';
        setTimeout(() => { copyBtn.querySelector('svg').style.color = ''; }, 1200);
      } catch (err) {
        console.error('Kopiering feilet:', err);
      }
    });

    shareBtn.addEventListener('click', () => {
      if (!currentReport || !navigator.share) return;
      navigator.share({
        title: currentReport.title,
        text: `${currentReport.title}\n\n${currentReport.report}`
      }).catch(() => {});
    });

    deleteReportBtn.addEventListener('click', async () => {
      if (!currentReport) return;
      if (!confirm('Slette denne rapporten?')) return;
      try {
        await deleteDoc(doc(reportsCol(user.uid), currentReport.id));
        reportDetail.classList.remove('open');
        currentReport = null;
      } catch (err) {
        console.error('Sletting feilet:', err);
      }
    });

    // ── Mic button ─────────────────────────────────────────
    micBtn.addEventListener('click', async () => {
      if (isBusy) return;
      if (!isRecording && !isPaused) {
        resetAll();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mime = pickMimeType();
          mediaRecorder = new MediaRecorder(stream, mime
            ? { mimeType: mime, audioBitsPerSecond: 32000 }
            : { audioBitsPerSecond: 32000 });
          chunks = [];
          audioBlob = null;
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
          mediaRecorder.start(1000);
          isRecording = true;
          seconds = 0;
          startTimer();
          micBtn.classList.add('recording');
          pulses.forEach(p => p.classList.add('active'));
          statusEl.textContent = 'tar opp';
          statusEl.className = 'status recording';
          miniControls.classList.add('visible');
          setFeedback('');
        } catch (err) {
          console.error('Mikrofon:', err);
          setFeedback('fikk ikke tilgang til mikrofonen', 'error');
        }
      } else {
        await stopRecording();
        miniControls.classList.add('visible');
      }
    });

    // ── Pause/resume ───────────────────────────────────────
    pauseBtn.addEventListener('click', () => {
      if (!mediaRecorder || (!isRecording && !isPaused)) return;
      if (!isPaused) {
        mediaRecorder.pause();
        isPaused = true;
        isRecording = false;
        stopTimer();
        micBtn.classList.remove('recording');
        micBtn.classList.add('paused');
        pulses.forEach(p => p.classList.remove('active'));
        statusEl.textContent = 'pause';
        statusEl.className = 'status paused';
        setPauseIcon(true);
      } else {
        mediaRecorder.resume();
        isPaused = false;
        isRecording = true;
        startTimer();
        micBtn.classList.add('recording');
        micBtn.classList.remove('paused');
        pulses.forEach(p => p.classList.add('active'));
        statusEl.textContent = 'tar opp';
        statusEl.className = 'status recording';
        setPauseIcon(false);
      }
    });

    // ── Forkast opptak ─────────────────────────────────────
    $('deleteBtn').addEventListener('click', resetAll);

    // ── Lag rapport: opptak → Gemini → Firestore → vis ─────
    actionBtn.addEventListener('click', async () => {
      if (isBusy) return;
      if (isRecording || isPaused) await stopRecording();
      if (!audioBlob || audioBlob.size === 0) {
        setFeedback('ta opp noe først', 'error');
        return;
      }
      if (audioBlob.size > MAX_AUDIO_BYTES) {
        setFeedback('opptaket er for langt — del det opp i flere memoer', 'error');
        return;
      }

      setBusy(true);
      setFeedback('');
      const durationSec = seconds;

      try {
        const { title, report, transcript } = await generateReport(audioBlob, audioMime, forcedLang);
        const saved = await saveReport({
          title: title || 'Rapport',
          report: report || '',
          transcript: transcript || '',
          lang: forcedLang,
          durationSec,
          createdAt: Timestamp.now()
        });
        resetAll();
        showTab('history');
        openReport(saved);
      } catch (err) {
        console.error('Rapport feilet:', err);
        setBusy(false);
        setFeedback(friendlyError(err), 'error');
      }
    });

    // ── Init ───────────────────────────────────────────────
    updateAuthUI();
  </script>
</body>
</html>
